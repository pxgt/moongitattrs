name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Record toolchain
        run: moon version --all

      - name: Update package registry
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Generate and verify public interfaces
        run: |
          moon info --target all
          git diff --exit-code

      - name: Check every stable backend
        run: moon check --target all --deny-warn --warn-list +73

      - name: Build every stable backend
        run: moon build --target all

      - name: Test every stable backend
        run: moon test --target all --deny-warn --warn-list +73

      - name: Run CLI examples
        run: |
          moon run cmd/main
          moon run cmd/main -- audit .gitattributes
          moon run cmd/main -- explain examples/sample.gitattributes README.md
          moon run cmd/main -- explain-json examples/sample.gitattributes README.md
          moon run cmd/main -- audit examples/sample.gitattributes
          moon run cmd/main -- match "docs/**" "docs/guide.md"

      - name: Verify package artifact
        run: moon package --frozen

      - name: Reject generated or formatting drift
        run: git diff --exit-code
